# 前端站点：托管构建产物 + SPA 路由回退 + API 反向代理。
#
# 与 deploy/nginx.conf（王恒那个入口）的区别：那个配置把 location / 整体转给 Django，
# 没有前端资源位置；本文件是前端镜像自带的站点配置，落地在 /etc/nginx/conf.d/default.conf。
# 两者不冲突：接入 compose 后由本文件负责前端与 /api，根入口那份可继续只服务 API 与 /static/。
#
# 上游为 api:8000，与 compose.yaml 里的服务名一致；换部署名时改这一处。
#
# 这里用「变量 + Docker 内嵌 DNS」让上游在**请求时**解析，而不是 nginx 启动时解析。
# 直接写 proxy_pass http://api:8000 会有两个坑：
#   1. api 容器尚未创建时 nginx 启动即失败（host not found in upstream "api"）；
#   2. api 重启换了 IP 后，nginx 仍指向旧地址，直到自己重启。
# 用变量时 nginx 不会自动拼接原始 URI，必须显式加 $request_uri（含查询串）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的构建产物可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API 与健康检查原样转发给后端（显式带上 $request_uri，路径与查询串都不变）
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # SPA 回退：/admin/books 这类前端路由直接刷新时也要返回 index.html，
    # 否则会 404 —— 后端并没有这些路径。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
