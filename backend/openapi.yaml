          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        title:
          type: string
          maxLength: 200
        audience:
          type: string
          maxLength: 100
        starts_at:
          type: string
          format: date-time
        capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        published:
          type: boolean
        branch:
          type: integer
      required:
      - audience
      - branch
      - capacity
      - created_at
      - id
      - starts_at
      - title
      - updated_at
