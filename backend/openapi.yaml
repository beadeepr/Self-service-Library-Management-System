openapi: 3.0.3
info:
  title: 无人值守图书馆 API
  version: 1.0.0
  description: JWT 鉴权；角色 reader/admin/operator；外部服务默认模拟。
paths:
  /api/auth/login/:
    post:
      operationId: api_auth_login_create
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - data
                - request_id
                properties:
                  code:
                    type: integer
                    description: 0 为成功；4001 为库存不可借；HTTP 错误使用状态码 × 100
                  message:
                    type: string
                  data:
                    type: object
                    additionalProperties: {}
                  request_id:
                    type: string
                    format: uuid
          description: ''
  /api/auth/refresh/:
    post:
      operationId: api_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
